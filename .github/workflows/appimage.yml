# Copyright (C) 2026 The ButterEye contributors
#
# ButterEye as an x86_64 AppImage - A TRIAL, NOT A RELEASE (docs/appimage-trial.md).
# Builds the AppImage in an ubuntu:22.04 container (packaging/appimage/
# build-appimage.sh), then runs it in clean containers of five distributions
# with nothing ButterEye needs installed, and once on the runner itself through
# the runtime's FUSE mount (packaging/appimage/test-appimage.sh).
#
# Deliberately NOT triggered by pushes to main: a push there that touches
# packaging/** already starts the two-hour Windows build, and this is a trial on
# its own branch. Run it by hand (workflow_dispatch) or push to appimage-trial.
#
# What a green run here does not prove: anything about a real GPU (the runners
# have none - GPU findings in the doctor are expected), a real X11 or Wayland
# session (the GUI runs on Qt's offscreen platform, mpv draws to --vo=null),
# hardware decoding through the host's VA-API, sound, or the FUSE path on a
# desktop distribution rather than on GitHub's runner image.

name: AppImage (trial)

on:
  workflow_dispatch:
  push:
    branches: [appimage-trial]

permissions:
  contents: read

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the AppImage (ubuntu:22.04)
    runs-on: ubuntu-latest
    # ubuntu:22.04 pinned by the digest of its multi-arch index (the registry's
    # Docker-Content-Digest for library/ubuntu:22.04); bump it for updates
    container: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
    timeout-minutes: 120
    env:
      XDG_CACHE_HOME: /github/home/.cache
    steps:
      - name: Install git (for the checkout)
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends git ca-certificates >/dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trust the checkout (owned by the runner, used as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the pinned downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /github/home/.cache/buttereye/appimage-dl
          key: appimage-dl-${{ hashFiles('packaging/appimage/pins.sh') }}

      - name: Install the build dependencies
        run: packaging/appimage/build-appimage.sh --install-build-deps

      - name: Build the AppImage and its sources tar
        run: JOBS=$(nproc) packaging/appimage/build-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: |
            /github/home/.cache/buttereye/appimage/ButterEye-*-x86_64.AppImage
            /github/home/.cache/buttereye/appimage/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload the Corresponding Source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-sources
          path: /github/home/.cache/buttereye/appimage/ButterEye-*-appimage-sources.tar
          if-no-files-found: error
          retention-days: 14

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-build-logs
          path: /github/home/.cache/buttereye/appimage/build-logs
          if-no-files-found: ignore
          retention-days: 14

  test:
    name: Test in ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # each pinned by the digest of its multi-arch index, as above
          - name: ubuntu-22.04
            image: ubuntu:22.04@sha256:5ec03bb3441e8b0bf3b4f9cd4629a1ae763010dc3035bb8da3ae6cf026486401
          - name: ubuntu-24.04
            image: ubuntu:24.04@sha256:534baea6a22c03a63003dbc8dbe78fe34bc0d7e595d9a9dc9834884ff530eb55
          - name: debian-12
            image: debian:12@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858
          - name: debian-13
            image: debian:13@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
          - name: fedora-44
            image: fedora:44@sha256:43b29f65a41eb9c35e1cd5323e3bdf3b655c2357a9f4f1ff2f9c2798e5045d80
          - name: archlinux
            image: archlinux:latest@sha256:3c64b538588416593f69a1aebd2f2ec0f2541b29159f32556fa7def2167147a0
    container: ${{ matrix.image }}
    steps:
      # no git in these images on purpose: the checkout falls back to the REST API
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: /tmp/dist

      - name: Check the AppImage's checksum
        run: |
          cd /tmp/dist
          sha256sum -c --ignore-missing SHA256SUMS
          chmod +x ButterEye-*-x86_64.AppImage
          ls -l ButterEye-*-x86_64.AppImage

      - name: Test the AppImage (APPIMAGE_EXTRACT_AND_RUN, no FUSE in a container)
        run: bash packaging/appimage/test-appimage.sh /tmp/dist/ButterEye-*-x86_64.AppImage /tmp/results

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-results-${{ matrix.name }}
          path: /tmp/results
          if-no-files-found: ignore
          retention-days: 14

  host:
    name: Test on the runner (FUSE mount)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: ${{ runner.temp }}/dist

      - name: Describe the runner
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, $(nproc) threads"
          echo "fusermount3: $(command -v fusermount3 || echo none)"
          echo "fusermount: $(command -v fusermount || echo none)"
          ls -l /dev/fuse || true
          for t in mpv vspipe ffmpeg python3; do echo "$t: $(command -v $t || echo none)"; done

      - name: Check the AppImage's checksum
        run: |
          cd "$RUNNER_TEMP/dist"
          sha256sum -c --ignore-missing SHA256SUMS
          chmod +x ButterEye-*-x86_64.AppImage

      - name: Test the AppImage through the runtime's FUSE mount
        run: bash packaging/appimage/test-appimage.sh "$RUNNER_TEMP"/dist/ButterEye-*-x86_64.AppImage "$RUNNER_TEMP/results" --fuse

      # The repository's own test suite, run by the AppImage's Python (its Qt
      # and VapourSynth wheels) against this checkout's buttereye - which is not
      # inside the AppImage, so osapi.LINUX_APP is None and the Fedora
      # expectations hold. The tools come from packaging/appimage/test-requirements.txt,
      # pinned by hash. The deselects are tools/macos-tests.sh's platform-neutral
      # ones; everything else that needs mpv, vspipe or the RPMs skips itself.
      - name: The repository's tests, with the AppImage's Python
        env:
          QT_QPA_PLATFORM: offscreen
          QT_ACCESSIBILITY: "1"
        run: |
          python3 -m pip install --disable-pip-version-check -q --require-hashes --only-binary=:all: \
            --no-deps --target "$RUNNER_TEMP/testdeps" -r packaging/appimage/test-requirements.txt
          tree=$(mktemp -d)
          (cd "$tree" && "$RUNNER_TEMP"/dist/ButterEye-*-x86_64.AppImage --appimage-extract >/dev/null)
          "$tree/squashfs-root/python/bin/python3.14" -B -c "import sys; sys.path[:0] = [sys.argv.pop(1), '.']; import pytest; raise SystemExit(pytest.main(sys.argv[1:]))" \
            "$RUNNER_TEMP/testdeps" -p no:cacheprovider -q -rs \
            --deselect tests/gui/test_bench_page.py::test_cancel_stops_the_run_and_keeps_old_results

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-results-runner
          path: ${{ runner.temp }}/results
          if-no-files-found: ignore
          retention-days: 14

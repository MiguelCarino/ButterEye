#
# ButterEye's mpv profile (SCOPE §4.3). ButterEye writes this file and may
# replace it; put your own settings in your mpv.conf instead.
# Use it in plain mpv with:  mpv --include=<this file> --profile=buttereye FILE
#
# There is deliberately no vf= line: ButterEye adds the @buttereye filter over
# IPC once the display rate and colour parameters are known.

[buttereye]
profile-desc=ButterEye smooth motion (frame interpolation)
# The VapourSynth bridge takes only system-memory frames: copy-back decoding.
hwdec=auto-copy
hwdec-codecs=all
# Filters that add frames can make precise seeks skip their target otherwise.
hr-seek=yes
hr-seek-framedrop=no
# mpv's own frame blending must not mix with interpolated frames.
interpolation=no
video-sync=display-resample
# Keep the window size when smoothing runs at a smaller size than the video.
auto-window-resize=no
# Never store the @buttereye filter in watch-later files.
watch-later-options-remove=vf
